<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Drink</title>
</head>
<style>
    *{
        margin: 0;
    }
    .box{
        margin-top: 100px;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
    }
    .box img{
        width: 300px;
        height: 300px;
        cursor: pointer;
    }
    .chai h1 , .gaana h1{
        text-align: center;
        margin-bottom: 20px;
    }
    .chai p , .gaana p{
        text-align: center;
        font-size: 20px;
    }
</style>
<body>
    <div class="box">
        <div class="chai">
            <h1>Chai</h1>
            <img src="./tea.webp" id="hoverTea" alt="" >
            <p>Rs. 10</p>
        </div>
        <div class="gaana">
            <h1>Gaane ka juice</h1>
            <img src="./gaanekajuice.png" id="hoverGaana" alt="">
            <p>Rs.20</p>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
